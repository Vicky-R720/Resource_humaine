<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Journal d'audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Journal d'audit</h1>

        <div class="card">
            <div class="card-header">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="mb-0">Historique des actions</h5>
                    </div>
                    <div class="col-md-6 text-end">
                        <a th:href="@{/audit/statistics}" class="btn btn-info btn-sm">Statistiques</a>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Utilisateur</th>
                                <th>Action</th>
                                <th>Table</th>
                                <th>ID Enregistrement</th>
                                <th>Date</th>
                                <th>IP</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- CORRECTION : Utiliser auditLogs directement -->
                            <tr th:each="log : ${auditLogs}">
                                <td th:text="${log.user != null} ? ${log.user.nom + ' ' + log.user.prenom} : 'System'">
                                </td>
                                <td>
                                    <span
                                        th:class="${'badge bg-' + (log.action == 'CREATE' ? 'success' : (log.action == 'UPDATE' ? 'warning' : 'danger'))}"
                                        th:text="${log.action}"></span>
                                </td>
                                <td th:text="${log.tableName}"></td>
                                <td th:text="${log.recordId}"></td>
                                <td th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${log.ipAddress}"></td>
                                <td>
                                    <a th:href="@{/audit/trail(tableName=${log.tableName}, recordId=${log.recordId})}"
                                        class="btn btn-sm btn-outline-primary">Traçabilité</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination corrigée -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit(page=0)}">Premier</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit(page=${currentPage - 1})}">Précédent</a>
                        </li>

                        <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item"
                            th:classappend="${i == currentPage + 1} ? 'active'">
                            <a class="page-link" th:href="@{/audit(page=${i - 1})}" th:text="${i}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit(page=${currentPage + 1})}">Suivant</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/audit(page=${totalPages - 1})}">Dernier</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>

</html>
