<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Historique des congés</title>
    <link rel="stylesheet" th:href="@{/css/leave.css}">
</head>

<body>
    <h1>Historique des congés</h1>

    <label>Personnel ID:</label>
    <input type="number" id="personnelIdHistory" value="1">
    <button id="loadHistory">Charger</button>

    <table border="1">
        <thead>
            <tr>
                <th>Date début</th>
                <th>Date fin</th>
                <th>Motif</th>
                <th>Type</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody id="historyTable"></tbody>
    </table>

    <script th:src="@{/js/leave.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initHistory();
        });
    </script>
</body>

</html>
