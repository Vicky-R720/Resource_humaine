<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Statistiques des documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Statistiques des documents</h1>

        <div class="row mb-3">
            <div class="col-md-12">
                <a th:href="@{/documents}" class="btn btn-secondary">Retour à la liste</a>
            </div>
        </div>

        <div class="row">
            <!-- Carte statistique documents non vérifiés -->
            <div class="col-md-4 mb-4">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h5 class="card-title">Documents non vérifiés</h5>
                                <h2 class="card-text" th:text="${unverifiedCount}">0</h2>
                            </div>
                            <div class="align-self-center">
                                <span class="fs-1">📋</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tableau des statistiques par type -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Répartition par type de document</h5>
            </div>
            <div class="card-body">
                <div th:if="${typeStatistics.empty}" class="text-center py-4">
                    <p class="text-muted">Aucune statistique disponible</p>
                </div>

                <div th:unless="${typeStatistics.empty}" class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Type de document</th>
                                <th>Nombre</th>
                                <th>Pourcentage</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="stat : ${typeStatistics}">
                                <td>
                                    <span class="badge" th:classappend="${stat[0] == 'CIN'} ? 'bg-primary' : 
                                                         ${stat[0] == 'diplome'} ? 'bg-success' : 
                                                         ${stat[0] == 'contrat'} ? 'bg-info' : 
                                                         ${stat[0] == 'medical'} ? 'bg-warning' : 'bg-secondary'"
                                        th:text="${stat[0]}">
                                    </span>
                                </td>
                                <td th:text="${stat[1]}"></td>
                                <td>
                                    <div class="progress" style="height: 20px;">
                                        <div class="progress-bar" th:style="'width: ' + ${stat[1]} + '%;'"
                                            th:text="${stat[1]} + '%'">
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Graphique simple -->
        <div class="card mt-4">
            <div class="card-header">
                <h5 class="mb-0">Visualisation des données</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Répartition par type</h6>
                        <div th:each="stat : ${typeStatistics}" class="mb-2">
                            <div class="d-flex justify-content-between">
                                <span th:text="${stat[0]}"></span>
                                <span th:text="${stat[1]}"></span>
                            </div>
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar" th:classappend="${stat[0] == 'CIN'} ? 'bg-primary' : 
                                                    ${stat[0] == 'diplome'} ? 'bg-success' : 
                                                    ${stat[0] == 'contrat'} ? 'bg-info' : 
                                                    ${stat[0] == 'medical'} ? 'bg-warning' : 'bg-secondary'"
                                    th:style="'width: ' + ${stat[1]} + '%;'">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h6>Statut de vérification</h6>
                        <div class="text-center">
                            <div class="mb-3">
                                <span class="fs-1">🔍</span>
                                <h4 th:text="${unverifiedCount} + ' non vérifiés'"></h4>
                            </div>
                            <p class="text-muted">Documents en attente de validation</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
