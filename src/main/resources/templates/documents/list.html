<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestion des documents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Archivage des documents RH</h1>

        <!-- Messages flash -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <!-- CORRECTION : Lien correct vers le formulaire d'upload -->
                <a th:href="@{/documents/upload}" class="btn btn-primary">Nouveau document</a>
                <a th:href="@{/documents/unverified}" class="btn btn-warning">
                    Documents non vérifiés
                    <span th:if="${unverifiedCount > 0}" class="badge bg-danger" th:text="${unverifiedCount}"></span>
                </a>
            </div>
            <div class="col-md-6 text-end">
                <a th:href="@{/documents/statistics}" class="btn btn-info">Statistiques</a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Documents archivés</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Personnel</th>
                                <th>Type</th>
                                <th>Nom du document</th>
                                <th>Date expiration</th>
                                <th>Statut</th>
                                <th>Date création</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="doc : ${documents}">
                                <td
                                    th:text="${doc.personnel != null} ? ${doc.personnel.person.nom + ' ' + doc.personnel.person.prenom} : 'N/A'">
                                </td>
                                <td th:text="${doc.typeDocument}"></td>
                                <td th:text="${doc.nomDocument}"></td>
                                <td>
                                    <span th:if="${doc.dateExpiration}"
                                        th:class="${doc.dateExpiration.isBefore(T(java.time.LocalDate).now())} ? 'text-danger' : ''"
                                        th:text="${#temporals.format(doc.dateExpiration, 'dd/MM/yyyy')}"></span>
                                    <span th:unless="${doc.dateExpiration}">-</span>
                                </td>
                                <td>
                                    <span th:if="${doc.isVerified}" class="badge bg-success">Vérifié</span>
                                    <span th:unless="${doc.isVerified}" class="badge bg-warning">En attente</span>
                                </td>
                                <td th:text="${#temporals.format(doc.createdAt, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <a th:href="@{/documents/download/{id}(id=${doc.id})}"
                                        class="btn btn-sm btn-outline-primary">Télécharger</a>
                                    <a th:if="${!doc.isVerified}" th:href="@{/documents/verify/{id}(id=${doc.id})}"
                                        class="btn btn-sm btn-outline-success">Vérifier</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/documents(page=0)}">Premier</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/documents(page=${currentPage - 1})}">Précédent</a>
                        </li>

                        <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item"
                            th:classappend="${i == currentPage + 1} ? 'active'">
                            <a class="page-link" th:href="@{/documents(page=${i - 1})}" th:text="${i}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/documents(page=${currentPage + 1})}">Suivant</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/documents(page=${totalPages - 1})}">Dernier</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
