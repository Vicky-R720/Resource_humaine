<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chatbot RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .user-message {
            background: #007bff;
            color: white;
            border-radius: 15px 15px 0 15px;
        }

        .bot-message {
            background: #e9ecef;
            border-radius: 15px 15px 15px 0;
        }

        .message {
            padding: 10px 15px;
            margin: 5px 0;
            max-width: 80%;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">🤖 Chatbot RH</h4>
                        <small>Posez vos questions sur les congés, la paie, les contrats...</small>
                    </div>
                    <div class="card-body">
                        <div id="chatHistory" class="chat-container p-3 border">
                            <div class="bot-message message">
                                👋 Bonjour ! Je suis votre assistant RH. Comment puis-je vous aider ?
                            </div>
                        </div>

                        <form id="chatForm" class="mb-3">
                            <div class="input-group">
                                <input type="text" id="questionInput" class="form-control"
                                    placeholder="Tapez votre question..." required>
                                <button type="submit" class="btn btn-primary">Envoyer</button>
                            </div>
                        </form>

                        <div class="quick-questions">
                            <small class="text-muted d-block mb-2">Questions rapides :</small>
                            <button class="btn btn-outline-secondary btn-sm me-1 mb-1"
                                onclick="setQuickQuestion('Comment demander un congé ?')">Congés</button>
                            <button class="btn btn-outline-secondary btn-sm me-1 mb-1"
                                onclick="setQuickQuestion('Quand est payé le salaire ?')">Salaire</button>
                            <button class="btn btn-outline-secondary btn-sm me-1 mb-1"
                                onclick="setQuickQuestion('Comment obtenir une attestation ?')">Documents</button>
                            <button class="btn btn-outline-secondary btn-sm mb-1"
                                onclick="setQuickQuestion('Qui contacter en cas d absence ?')">Absence</button>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <a href="/employee/self-service/dashboard" class="btn btn-secondary">← Retour au dashboard</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setQuickQuestion(question) {
            document.getElementById('questionInput').value = question;
            document.getElementById('chatForm').dispatchEvent(new Event('submit'));
        }

        document.getElementById('chatForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const question = document.getElementById('questionInput').value;
            const chatHistory = document.getElementById('chatHistory');

            // Ajouter message utilisateur
            const userMsg = document.createElement('div');
            userMsg.className = 'user-message message ms-auto';
            userMsg.textContent = question;
            chatHistory.appendChild(userMsg);

            // Envoyer au serveur
            fetch('/employee/chatbot/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'question=' + encodeURIComponent(question)
            })
                .then(response => response.json())
                .then(data => {
                    const botMsg = document.createElement('div');
                    botMsg.className = 'bot-message message';
                    botMsg.textContent = data.response;
                    chatHistory.appendChild(botMsg);

                    document.getElementById('questionInput').value = '';
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                })
                .catch(error => {
                    const errorMsg = document.createElement('div');
                    errorMsg.className = 'bot-message message';
                    errorMsg.textContent = 'Désolé, une erreur est survenue.';
                    chatHistory.appendChild(errorMsg);
                });
        });

        // Auto-scroll
        document.getElementById('chatHistory').scrollTop = document.getElementById('chatHistory').scrollHeight;
    </script>
</body>

</html>
