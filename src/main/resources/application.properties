spring.application.name=gest-entp

spring.datasource.url=jdbc:postgresql://localhost:5433/fonctionrh
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Activer la création automatique des tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
pdf.storage.path=/tmp/contrats/
server.port=8080

# Gemini API Configuration
gemini.api.key=AIzaSyAq7JdUrcYVxOUMMmBQnsFc_aGtYHV1etE

# Optional: Gemini API URL
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent

# Configuration pour les uploads de fichiers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Créer le répertoire d'upload automatiquement
file.upload-dir=./uploads/documents/

# Configuration Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
