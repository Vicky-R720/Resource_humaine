<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon Équipe - Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/manager-header :: header"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="fragments/manager-sidebar :: sidebar"></div>
            </div>
            
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Mon Équipe</h2>
                    <span class="badge bg-primary" th:text="'Total: ' + ${#lists.size(teamMembers)} + ' membres'"></span>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div th:if="${teamMembers == null or #lists.isEmpty(teamMembers)}" class="text-center text-muted">
                            <p>Aucun membre dans votre équipe</p>
                        </div>
                        <div th:if="${teamMembers != null and not #lists.isEmpty(teamMembers)}" class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Matricule</th>
                                        <th>Nom</th>
                                        <th>Prénom</th>
                                        <th>Contact</th>
                                        <th>Date d'embauche</th>
                                        <th>Statut</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="member : ${teamMembers}">
                                        <td th:text="${member.matricule}">EMP001</td>
                                        <td th:text="${member.person.nom}">Dupont</td>
                                        <td th:text="${member.person.prenom}">Jean</td>
                                        <td th:text="${member.person.contact}">jean.dupont@entreprise.com</td>
                                        <td th:text="${#temporals.format(member.dateEmbauche, 'dd/MM/yyyy')}">01/01/2024</td>
                                        <td>
                                            <span th:class="${'badge ' + (member.statut == 'actif' ? 'bg-success' : 'bg-secondary')}"
                                                  th:text="${member.statut}">actif</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
