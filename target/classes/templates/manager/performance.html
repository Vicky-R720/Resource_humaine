<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Performances - Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/manager-header :: header"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="fragments/manager-sidebar :: sidebar"></div>
            </div>
            
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Suivi des Performances</h2>
                    <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>
                        Retour au tableau de bord
                    </a>
                </div>

                <!-- Filtres -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form th:action="@{/manager/performance}" method="get">
                            <div class="row">
                                <div class="col-md-5">
                                    <label class="form-label">Date de début</label>
                                    <input type="date" name="startDate" th:value="${startDate}" class="form-control">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">Date de fin</label>
                                    <input type="date" name="endDate" th:value="${endDate}" class="form-control">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">&nbsp;</label>
                                    <button type="submit" class="btn btn-primary w-100">Filtrer</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Statistiques de performance -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card text-white bg-primary">
                            <div class="card-body text-center">
                                <h4 class="card-title" th:text="${performanceData.teamMembers}">0</h4>
                                <p class="card-text">Membres d'équipe</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success">
                            <div class="card-body text-center">
                                <h4 class="card-title" th:text="${performanceData.averageScore != null} ? ${#numbers.formatDecimal(performanceData.averageScore, 1, 2)} : 'N/A'">N/A</h4>
                                <p class="card-text">Score moyen</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-info">
                            <div class="card-body text-center">
                                <h4 class="card-title" th:text="${performanceData.evaluationsCount}">0</h4>
                                <p class="card-text">Évaluations</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Distribution des scores -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-chart-bar me-2"></i>
                            Distribution des Scores
                        </h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${performanceData.scoreDistribution != null}">
                            <div th:each="entry : ${performanceData.scoreDistribution}" class="mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span th:text="${entry.key}">Catégorie</span>
                                    <span th:text="${entry.value} + ' employés'">0 employés</span>
                                </div>
                                <div class="progress" style="height: 20px;">
                                    <div class="progress-bar" 
                                         th:style="'width: ' + ${(entry.value / performanceData.teamMembers) * 100} + '%;'"
                                         th:class="${'bg-' + (entry.key == 'Excellent' ? 'success' : entry.key == 'Très bon' ? 'info' : entry.key == 'Bon' ? 'primary' : entry.key == 'Satisfaisant' ? 'warning' : 'danger')}"
                                         th:text="${#numbers.formatDecimal((entry.value / performanceData.teamMembers) * 100, 1, 1)} + '%'">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Liste des membres d'équipe avec scores simulés -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-list me-2"></i>
                            Performances par Employé
                        </h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${teamMembers != null and not #lists.isEmpty(teamMembers)}" class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Employé</th>
                                        <th>Matricule</th>
                                        <th>Poste</th>
                                        <th>Score</th>
                                        <th>Niveau</th>
                                        <th>Dernière évaluation</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="member : ${teamMembers}">
                                        <td th:text="${member.person.nom} + ' ' + ${member.person.prenom}">Jean Dupont</td>
                                        <td th:text="${member.matricule}">EMP001</td>
                                        <td th:text="${member.post?.name != null} ? ${member.post.name} : 'Non défini'">Développeur</td>
                                        <td>
                                            <!-- Score simulé basé sur le matricule -->
                                            <span th:text="${#numbers.formatDecimal((member.matricule.hashCode() % 30) + 70, 0, 0)}">85</span>/100
                                        </td>
                                        <td>
                                            <!-- Niveau simulé -->
                                            <span th:class="${'badge ' + ((member.matricule.hashCode() % 30) + 70 >= 90 ? 'bg-success' : (member.matricule.hashCode() % 30) + 70 >= 80 ? 'bg-info' : (member.matricule.hashCode() % 30) + 70 >= 70 ? 'bg-primary' : (member.matricule.hashCode() % 30) + 70 >= 60 ? 'bg-warning' : 'bg-danger')}"
                                                  th:text="${(member.matricule.hashCode() % 30) + 70 >= 90 ? 'Excellent' : (member.matricule.hashCode() % 30) + 70 >= 80 ? 'Très bon' : (member.matricule.hashCode() % 30) + 70 >= 70 ? 'Bon' : (member.matricule.hashCode() % 30) + 70 >= 60 ? 'Satisfaisant' : 'À améliorer'}">
                                                Bon
                                            </span>
                                        </td>
                                        <td th:text="${#temporals.format(#temporals.createNow().minusDays(member.matricule.hashCode() % 30), 'dd/MM/yyyy')}">15/11/2025</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
