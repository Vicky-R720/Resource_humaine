<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Congés - Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/manager-header :: header"></div>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="fragments/manager-sidebar :: sidebar"></div>
            </div>
            
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Gestion des Demandes de Congés</h2>
                    <a th:href="@{/manager/dashboard}" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-2"></i>
                        Retour au tableau de bord
                    </a>
                </div>

                <!-- Alertes -->
                <div th:if="${param.success != null}" class="alert alert-success">
                    <i class="fas fa-check-circle me-2"></i>
                    <span th:text="${param.success}">Succès</span>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-list me-2"></i>
                            Demandes en Attente de Validation
                        </h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${pendingRequests == null or #lists.isEmpty(pendingRequests)}" class="text-center text-muted">
                            <p>Aucune demande de congé en attente de validation</p>
                        </div>
                        <div th:if="${pendingRequests != null and not #lists.isEmpty(pendingRequests)}" class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Employé</th>
                                        <th>Période</th>
                                        <th>Type</th>
                                        <th>Nombre de jours</th>
                                        <th>Motif</th>
                                        <th>Date demande</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="request : ${pendingRequests}">
                                        <td th:text="${request.personnel.person.nom} + ' ' + ${request.personnel.person.prenom}">John Doe</td>
                                        <td th:text="${#temporals.format(request.dateDebut, 'dd/MM/yyyy')} + ' - ' + ${#temporals.format(request.dateFin, 'dd/MM/yyyy')}">01/01/2025 - 05/01/2025</td>
                                        <td th:text="${request.leaveType.name}">Congé annuel</td>
                                        <td th:text="${request.nombreJours} + ' j'">5 j</td>
                                        <td th:text="${request.motif}">Vacances</td>
                                        <td th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')}">16/11/2025 18:00</td>
                                        <td>
                                            <div class="btn-group" role="group">
                                                <form th:action="@{/manager/leaves/approve/{id}(id=${request.id})}" method="post" class="d-inline">
                                                    <input type="hidden" name="comment" th:value="'Approuvé le ' + ${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}">
                                                    <button type="submit" class="btn btn-sm btn-success">
                                                        <i class="fas fa-check"></i>
                                                    </button>
                                                </form>
                                                <form th:action="@{/manager/leaves/reject/{id}(id=${request.id})}" method="post" class="d-inline">
                                                    <input type="hidden" name="comment" th:value="'Refusé le ' + ${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}">
                                                    <button type="submit" class="btn btn-sm btn-danger">
                                                        <i class="fas fa-times"></i>
                                                    </button>
                                                </form>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
