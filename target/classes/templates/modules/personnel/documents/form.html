<div class="container mt-4">
    <h3>Uploader un document</h3>

    <form th:action="@{'/personnel/' + ${personnelId} + '/documents/save'}" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label>Type de document</label>
            <select class="form-select" name="typeDocument" required>
                <option>Contrat</option>
                <option>CIN</option>
                <option>Diplôme</option>
                <option>Visite médicale</option>
                <option>Certificat</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Nom du document</label>
            <input type="text" class="form-control" name="nomDocument" required>
        </div>

        <div class="mb-3">
            <label>Fichier</label>
            <input type="file" class="form-control" name="file" required>
        </div>

        <div class="mb-3">
            <label>Date expiration (optionnel)</label>
            <input type="date" class="form-control" name="dateExpiration">
        </div>

        <button class="btn btn-success">Enregistrer</button>

    </form>
</div>
