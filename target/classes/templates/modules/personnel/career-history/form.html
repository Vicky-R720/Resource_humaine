<div class="container mt-4">
    <h3>Nouveau mouvement de carrière</h3>

    <form th:action="@{'/personnel/' + ${personnelId} + '/career-history/save'}" method="post">
        
        <div class="mb-3">
            <label>Type de mouvement</label>
            <select class="form-select" name="typeMouvement" required>
                <option>Promotion</option>
                <option>Mobilité interne</option>
                <option>Changement de poste</option>
                <option>Reclassement</option>
            </select>
        </div>

        <div class="mb-3">
            <label>Ancien poste</label>
            <input type="text" class="form-control" name="ancienPoste">
        </div>

        <div class="mb-3">
            <label>Nouveau poste</label>
            <input type="text" class="form-control" name="nouveauPoste" required>
        </div>

        <div class="mb-3">
            <label>Date du mouvement</label>
            <input type="date" class="form-control" name="dateMouvement" required>
        </div>

        <div class="mb-3">
            <label>Motif</label>
            <textarea class="form-control" name="motif"></textarea>
        </div>

        <button class="btn btn-success">Enregistrer</button>
    </form>
</div>
