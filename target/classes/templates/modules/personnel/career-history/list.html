<div class="container mt-4">
    <h2>Historique de carrière — [[${personnel.person.getFullName}]]</h2>

    <a th:href="@{/personnel/{id}/career-history/new(id=${personnel.id})}" class="btn btn-primary mb-3">
        + Ajouter un mouvement
    </a>


    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Date</th>
                <th>Ancien poste</th>
                <th>Nouveau poste</th>
                <th>Type</th>
                <th>Motif</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="h : ${careerHistory}">
                <td th:text="${h.dateMouvement}"></td>
                <td th:text="${h.ancienPoste}"></td>
                <td th:text="${h.nouveauPoste}"></td>
                <td th:text="${h.typeMouvement}"></td>
                <td th:text="${h.motif}"></td>
                <td>
                    <a th:href="@{'/personnel/' + ${personnel.id} + '/career-history/' + ${h.id} + '/delete'}"
                        class="btn btn-danger btn-sm">Supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
