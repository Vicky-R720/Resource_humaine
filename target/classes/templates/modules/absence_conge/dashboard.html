<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard congés</title>
    <link rel="stylesheet" th:href="@{/css/leave.css}">
</head>
<body>
    <h1>Dashboard des soldes de congés</h1>

    <label>Personnel ID:</label>
    <input type="number" id="personnelId" value="1">
    <button id="loadBalances">Charger</button>

    <div id="balances"></div>
    <div id="totalRemaining"></div>

    <script th:src="@{/js/leave.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initDashboard();
        });
    </script>
</body>
</html>
