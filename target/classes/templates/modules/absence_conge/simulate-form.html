<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Congés</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        label { display: block; margin-top: 10px; }
        input { padding: 5px; width: 100px; margin-right: 5px; }
        button { margin-top: 10px; padding: 5px 10px; }
        table { border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #eee; }
    </style>
</head>
<body>
<h1>Simulation des congés</h1>

<form id="simulateForm">
    <label>
        Solde initial :
        <input type="number" id="initialSolde" value="30" step="0.01" required>
    </label>
    <label>
        Années à simuler :
        <input type="number" id="yearsWorked" value="4" min="1" required>
    </label>

    <div id="joursPrisContainer"></div>
    <div id="soldeAcquisContainer"></div>

    <button type="submit">Simuler</button>
</form>

<div id="result"></div>

<script>
const yearsInput = document.getElementById('yearsWorked');
const joursPrisContainer = document.getElementById('joursPrisContainer');
const soldeAcquisContainer = document.getElementById('soldeAcquisContainer');
const form = document.getElementById('simulateForm');
const resultDiv = document.getElementById('result');

// Génère dynamiquement les inputs jours pris et acquis par année
function generateInputs() {
    let years = parseInt(yearsInput.value) || 1;
    if (years < 1) years = 1;
    yearsInput.value = years;

    // Jours pris
    joursPrisContainer.innerHTML = '<label>Jours pris par année :</label>';
    for (let i = 1; i <= years; i++) {
        const div = document.createElement('div');
        div.innerHTML = `<input type="number" class="joursPris" value="10" step="0.01"> Année ${i}`;
        joursPrisContainer.appendChild(div);
    }

    // Acquis
    soldeAcquisContainer.innerHTML = '<label>Acquis par année :</label>';
    for (let i = 1; i <= years; i++) {
        const div = document.createElement('div');
        div.innerHTML = `<input type="number" class="soldeAcquis" value="30" step="0.01"> Année ${i}`;
        soldeAcquisContainer.appendChild(div);
    }
}

// Initialisation
generateInputs();
yearsInput.addEventListener('input', generateInputs);

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const initialSolde = parseFloat(document.getElementById('initialSolde').value);
    const years = parseInt(yearsInput.value);

    // Collecter les jours pris
    const joursPrisParAn = [];
    document.querySelectorAll('.joursPris').forEach(input => joursPrisParAn.push(parseFloat(input.value)));

    // Collecter les acquis
    const soldeAcquisParAn = [];
    document.querySelectorAll('.soldeAcquis').forEach(input => soldeAcquisParAn.push(parseFloat(input.value)));

    const payload = { initialSolde, years, joursPrisParAn, soldeAcquisParAn };

    try {
        const response = await fetch('/test/balance/simulate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        displayResult(data);
    } catch (error) {
        resultDiv.innerHTML = '<p style="color:red">Erreur lors de la simulation.</p>';
        console.error(error);
    }
});

function displayResult(data) {
    let html = '<h2>Résultat de la simulation</h2>';
    html += '<table><tr><th>Année</th><th>Solde Initial</th><th>Acquis</th><th>Pris</th><th>Restant</th></tr>';

    Object.keys(data).forEach(year => {
        const row = data[year];
        html += `<tr>
            <td>${year}</td>
            <td>${row[0]}</td>
            <td>${row[1]}</td>
            <td>${row[2]}</td>
            <td>${row[3]}</td>
        </tr>`;
    });

    html += '</table>';
    resultDiv.innerHTML = html;
}
</script>

</body>
</html>
