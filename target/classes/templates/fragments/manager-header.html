<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/manager/dashboard}">
            <i class="fas fa-user-tie me-2"></i>
            Portail Manager
        </a>
        
        <div class="navbar-nav ms-auto">
            <div class="nav-item dropdown" th:if="${currentUser != null}">
                <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                    <i class="fas fa-user me-1"></i>
                    <!-- CORRECTION : Accéder à person.nom et person.prenom -->
                    <span th:text="${currentUser.person.nom + ' ' + currentUser.person.prenom}">Manager</span>
                </a>
                <ul class="dropdown-menu">
                    <li>
                        <span class="dropdown-item-text small">
                            <strong>Matricule:</strong> 
                            <span th:text="${currentUser.matricule}">EMP002</span>
                        </span>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item" th:href="@{/manager/dashboard}">
                            <i class="fas fa-tachometer-alt me-2"></i>
                            Tableau de bord
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/auth/logout}">
                            <i class="fas fa-sign-out-alt me-2"></i>
                            Déconnexion
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
</html>
