<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chatbot RH</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container { max-height: 500px; overflow-y: auto; }
        .user-message { background-color: #007bff; color: white; }
        .bot-message { background-color: #e9ecef; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Chatbot RH</h2>
        
        <div class="card">
            <div class="card-header">
                Posez vos questions sur les congés, la paie, les contrats...
            </div>
            <div class="card-body">
                <div id="chatHistory" class="chat-container mb-3 p-3 border rounded">
                    <!-- Messages du chat -->
                </div>
                
                <form id="chatForm">
                    <div class="input-group">
                        <input type="text" id="questionInput" class="form-control" 
                               placeholder="Tapez votre question..." required>
                        <button type="submit" class="btn btn-primary">Envoyer</button>
                    </div>
                </form>
                
                <div class="mt-3">
                    <h6>Questions fréquentes :</h6>
                    <button class="btn btn-outline-secondary btn-sm me-2" onclick="setQuestion('Comment demander un congé ?')">
                        Congés
                    </button>
                    <button class="btn btn-outline-secondary btn-sm me-2" onclick="setQuestion('Quand est payé le salaire ?')">
                        Salaire
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="setQuestion('Comment obtenir une attestation de travail ?')">
                        Documents
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setQuestion(question) {
            document.getElementById('questionInput').value = question;
        }
        
        document.getElementById('chatForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const question = document.getElementById('questionInput').value;
            
            // Ajouter message utilisateur
            addMessage(question, 'user');
            
            // Envoyer au serveur
            fetch('/rh/chatbot/ask', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'question=' + encodeURIComponent(question)
            })
            .then(response => response.json())
            .then(data => {
                addMessage(data.response, 'bot');
                document.getElementById('questionInput').value = '';
            })
            .catch(error => {
                addMessage('Désolé, une erreur est survenue.', 'bot');
            });
        });
        
        function addMessage(text, sender) {
            const chatHistory = document.getElementById('chatHistory');
            const messageDiv = document.createElement('div');
            messageDiv.className = `alert ${sender === 'user' ? 'alert-primary' : 'alert-secondary'}`;
            messageDiv.textContent = text;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    </script>
</body>
</html>
