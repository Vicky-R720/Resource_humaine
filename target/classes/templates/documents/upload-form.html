<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Upload de document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0">Uploader un nouveau document</h4>
                    </div>
                    <div class="card-body">
                        <!-- Messages flash -->
                        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${success}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <!-- CORRECTION : Formulaire avec des champs simples -->
                        <form th:action="@{/documents/upload}" method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="personnelId" class="form-label">Personnel *</label>
                                <select class="form-select" id="personnelId" name="personnelId" required>
                                    <option value="">Sélectionner un personnel</option>
                                    <option th:each="personnel : ${personnelList}" th:value="${personnel.id}"
                                        th:text="${personnel.person.nom + ' ' + personnel.person.prenom + ' (' + personnel.matricule + ')'}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="typeDocument" class="form-label">Type de document *</label>
                                <select class="form-select" id="typeDocument" name="typeDocument" required>
                                    <option value="">Sélectionner un type</option>
                                    <option value="CIN">Carte d'identité nationale (CIN)</option>
                                    <option value="diplome">Diplôme</option>
                                    <option value="attestation">Attestation</option>
                                    <option value="contrat">Contrat de travail</option>
                                    <option value="medical">Certificat médical</option>
                                    <option value="autre">Autre</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="nomDocument" class="form-label">Nom du document *</label>
                                <input type="text" class="form-control" id="nomDocument" name="nomDocument"
                                    placeholder="Ex: Diplôme Master Informatique" required>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="3"
                                    placeholder="Description optionnelle du document"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="dateExpiration" class="form-label">Date d'expiration (optionnel)</label>
                                <input type="date" class="form-control" id="dateExpiration" name="dateExpiration">
                            </div>

                            <div class="mb-3">
                                <label for="file" class="form-label">Fichier *</label>
                                <input type="file" class="form-control" id="file" name="file"
                                    accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
                                <div class="form-text">
                                    Formats acceptés: PDF, Word, JPG, PNG (max 10MB)
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/documents}" class="btn btn-secondary me-md-2">Annuler</a>
                                <button type="submit" class="btn btn-primary">Uploader le document</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Ajout de Bootstrap JS pour les alertes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
