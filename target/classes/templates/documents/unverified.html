<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Documents non vérifiés</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h1>Documents non vérifiés</h1>

        <!-- Messages flash -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <a th:href="@{/documents}" class="btn btn-secondary">Retour à la liste</a>
                <a th:href="@{/documents/upload}" class="btn btn-primary">Nouveau document</a>
            </div>
            <div class="col-md-6 text-end">
                <span class="badge bg-warning fs-6" th:text="'Total: ' + ${unverifiedCount}"></span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Documents en attente de vérification</h5>
            </div>
            <div class="card-body">
                <div th:if="${documents.empty}" class="text-center py-4">
                    <p class="text-muted">Aucun document en attente de vérification</p>
                </div>

                <div th:unless="${documents.empty}" class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Personnel</th>
                                <th>Type</th>
                                <th>Nom du document</th>
                                <th>Description</th>
                                <th>Date expiration</th>
                                <th>Date création</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="doc : ${documents}">
                                <td
                                    th:text="${doc.personnel != null} ? ${doc.personnel.person.nom + ' ' + doc.personnel.person.prenom} : 'N/A'">
                                </td>
                                <td>
                                    <span class="badge"
                                        th:classappend="${doc.typeDocument == 'CIN'} ? 'bg-primary' : 
                                                         ${doc.typeDocument == 'diplome'} ? 'bg-success' : 
                                                         ${doc.typeDocument == 'contrat'} ? 'bg-info' : 
                                                         ${doc.typeDocument == 'medical'} ? 'bg-warning' : 'bg-secondary'"
                                        th:text="${doc.typeDocument}">
                                    </span>
                                </td>
                                <td th:text="${doc.nomDocument}"></td>
                                <td>
                                    <span th:if="${doc.description}"
                                        th:text="${#strings.abbreviate(doc.description, 50)}"></span>
                                    <span th:unless="${doc.description}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${doc.dateExpiration}"
                                        th:class="${doc.dateExpiration.isBefore(T(java.time.LocalDate).now())} ? 'text-danger fw-bold' : ''"
                                        th:text="${#temporals.format(doc.dateExpiration, 'dd/MM/yyyy')}"></span>
                                    <span th:unless="${doc.dateExpiration}" class="text-muted">-</span>
                                </td>
                                <td th:text="${#temporals.format(doc.createdAt, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/documents/verify/{id}(id=${doc.id})}"
                                            class="btn btn-outline-success" title="Marquer comme vérifié">
                                            ✓ Vérifier
                                        </a>
                                        <a th:href="@{/documents/download/{id}(id=${doc.id})}"
                                            class="btn btn-outline-primary" title="Télécharger">
                                            📥
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
