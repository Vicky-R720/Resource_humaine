<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrice Compétences par Poste</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --accent: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --light-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-dark: #2d3748;
            --text-light: #718096;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light-bg);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            padding: 0.75rem 1.5rem;
            background: var(--card-bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--gradient);
            color: white;
        }

        .matrix-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .matrix-table th,
        .matrix-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .matrix-table th {
            background: var(--light-bg);
            font-weight: 600;
            color: var(--text-dark);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .matrix-table tr:hover {
            background: var(--light-bg);
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .level-5 { background: #d1fae5; color: #065f46; }
        .level-4 { background: #dbeafe; color: #1e40af; }
        .level-3 { background: #fef3c7; color: #92400e; }
        .level-2 { background: #fed7aa; color: #9a3412; }
        .level-1 { background: #fee2e2; color: #991b1b; }

        .category-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .cat-technique { background: #dbeafe; color: #1e40af; }
        .cat-soft_skills { background: #fce7f3; color: #9f1239; }
        .cat-management { background: #fef3c7; color: #92400e; }
        .cat-langue { background: #e0e7ff; color: #3730a3; }

        .top-competences {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .poste-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .poste-card h3 {
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .poste-card h3 i {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .competence-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .competence-item:last-child {
            border-bottom: none;
        }

        .filter-controls {
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-controls select {
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
        }

        .filter-controls select:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <a href="/rh/competences/dashboard" class="back-btn">
        <i class="fas fa-arrow-left"></i> Retour au Dashboard
    </a>

    <div class="header">
        <h1><i class="fas fa-table"></i> Matrice Compétences par Poste</h1>
        <p>Vue détaillée des niveaux moyens de compétences par poste</p>
    </div>

    <!-- Top Compétences par Poste -->
    <h2 style="margin-bottom: 1.5rem; color: var(--text-dark);">
        <i class="fas fa-star" style="color: var(--warning);"></i> 
        Top 5 Compétences par Poste
    </h2>

    <div class="top-competences" th:if="${topCompetencesByPost != null}">
        <div class="poste-card" th:each="entry : ${topCompetencesByPost}">
            <h3>
                <i class="fas fa-briefcase"></i>
                <span th:text="${entry.key}">Poste</span>
            </h3>
            <div class="competence-item" th:each="comp : ${entry.value}">
                <span th:text="${comp.competence}">Compétence</span>
                <span class="level-badge" 
                      th:classappend="${'level-' + #numbers.formatInteger(comp.niveau_moyen, 0)}"
                      th:text="${#numbers.formatDecimal(comp.niveau_moyen, 1, 1) + '/5'}">
                    4.5/5
                </span>
            </div>
        </div>
    </div>

    <!-- Filtres -->
    <div class="filter-controls">
        <select id="filterPoste" onchange="filterMatrix()">
            <option value="">Tous les postes</option>
        </select>
        <select id="filterCategorie" onchange="filterMatrix()">
            <option value="">Toutes les catégories</option>
            <option value="technique">Techniques</option>
            <option value="soft_skills">Soft Skills</option>
            <option value="management">Management</option>
            <option value="langue">Langues</option>
        </select>
        <button onclick="resetFilters()" class="back-btn" style="margin: 0;">
            <i class="fas fa-redo"></i> Réinitialiser
        </button>
    </div>

    <!-- Matrice Complète -->
    <div class="matrix-container">
        <h2 style="margin-bottom: 1.5rem; color: var(--text-dark);">
            <i class="fas fa-th"></i> Matrice Complète
        </h2>
        
        <table class="matrix-table" id="matrixTable">
            <thead>
                <tr>
                    <th>Poste</th>
                    <th>Compétence</th>
                    <th>Catégorie</th>
                    <th>Niveau Moyen</th>
                    <th>Nb Personnes</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${competenceMatrix}" 
                    th:attr="data-poste=${item.poste}, data-categorie=${item.categorie}">
                    <td th:text="${item.poste}">Poste</td>
                    <td th:text="${item.competence}">Compétence</td>
                    <td>
                        <span class="category-badge" 
                              th:classappend="${'cat-' + item.categorie}"
                              th:text="${item.categorie}">
                            Catégorie
                        </span>
                    </td>
                    <td>
                        <span class="level-badge" 
                              th:classappend="${'level-' + #numbers.formatInteger(item.niveauMoyen, 0)}"
                              th:text="${#numbers.formatDecimal(item.niveauMoyen, 1, 1) + '/5'}">
                            4.0/5
                        </span>
                    </td>
                    <td th:text="${item.nbPersonnes}">3</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const matrixData = /*[[${competenceMatrix}]]*/ [];
        
        // Remplir le filtre des postes
        document.addEventListener('DOMContentLoaded', function() {
            const postes = [...new Set(matrixData.map(item => item.poste))].sort();
            const filterPoste = document.getElementById('filterPoste');
            
            postes.forEach(poste => {
                const option = document.createElement('option');
                option.value = poste;
                option.textContent = poste;
                filterPoste.appendChild(option);
            });
            
            console.log("✅ Matrice chargée:", matrixData.length, "lignes");
        });
        /*]]>*/

        function filterMatrix() {
            const filterPoste = document.getElementById('filterPoste').value.toLowerCase();
            const filterCategorie = document.getElementById('filterCategorie').value.toLowerCase();
            
            const rows = document.querySelectorAll('#matrixTable tbody tr');
            
            rows.forEach(row => {
                const poste = row.getAttribute('data-poste').toLowerCase();
                const categorie = row.getAttribute('data-categorie').toLowerCase();
                
                const matchPoste = !filterPoste || poste.includes(filterPoste);
                const matchCategorie = !filterCategorie || categorie === filterCategorie;
                
                row.style.display = (matchPoste && matchCategorie) ? '' : 'none';
            });
        }

        function resetFilters() {
            document.getElementById('filterPoste').value = '';
            document.getElementById('filterCategorie').value = '';
            filterMatrix();
        }
    </script>
</body>
</html>
