<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Bulletin de Paie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="fragments/header :: header"></div>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-md-3">
                <div th:replace="fragments/employee-sidebar :: sidebar"></div>
            </div>
            <div class="col-md-9">
                <h2>Détails du Bulletin de Paie</h2>
                <div th:if="${payslip != null}">
                    <p>Période: <span th:text="${payslip.mois + '/' + payslip.annee}"></span></p>
                    <p>Net à payer: <span th:text="${#numbers.formatCurrency(payslip.netAPayer)}"></span></p>
                </div>
                <a th:href="@{/employee/self-service/payslips}" class="btn btn-secondary">Retour</a>
            </div>
        </div>
    </div>
</body>
</html>
